server:
  port: ${PORT:8080}

spring:
  application:
    name: backend

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aifashion}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

gemini:
  api:
    key: ${GEMINI_API_KEY:}

app:
  mail:
    from: ${MAIL_FROM:no-reply@fashion.local}
  password-reset:
    code-expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:10}
    resend-cooldown-seconds: ${PASSWORD_RESET_RESEND_COOLDOWN_SECONDS:60}
    max-attempts: ${PASSWORD_RESET_MAX_ATTEMPTS:5}
  payment:
    expiry-minutes: ${PAYMENT_EXPIRY_MINUTES:15}
    sepay-webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
    sepay-webhook-tolerance-seconds: ${SEPAY_WEBHOOK_TOLERANCE_SECONDS:300}
    vietqr:
      bank-id: ${VIETQR_BANK_ID:}
      account-number: ${VIETQR_ACCOUNT_NUMBER:}
      account-name: ${VIETQR_ACCOUNT_NAME:}
      template: ${VIETQR_TEMPLATE:compact2}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

info:
  app:
    name: AI Fashion Shop Backend
    description: Spring Boot REST API for the AI Fashion Shop
    version: 1.0.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
